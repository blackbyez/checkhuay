<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="80" r="140" fill="#fff" opacity="0.05"/>
  <circle cx="120" cy="580" r="180" fill="#fff" opacity="0.05"/>

  <!-- Icon target -->
  <g transform="translate(90 90)">
    <rect width="120" height="120" rx="24" fill="#fff" opacity="0.15"/>
    <text x="60" y="90" font-family="Arial, sans-serif" font-size="72" text-anchor="middle" fill="#fff">🎯</text>
  </g>

  <!-- Title -->
  <text x="240" y="150" font-family="Kanit, Prompt, sans-serif" font-size="72" font-weight="800" fill="#fff">เช็คหวย</text>
  <text x="240" y="200" font-family="Prompt, sans-serif" font-size="28" fill="#fde68a">ตรวจหวยรัฐบาล ยี่กี หวยหุ้น</text>

  <!-- Ticket -->
  <g transform="translate(90 290)">
    <rect width="1020" height="240" rx="24" fill="url(#gold)"/>
    <text x="510" y="70" font-family="Prompt, sans-serif" font-size="24" fill="#7f1d1d" text-anchor="middle" font-weight="600">รางวัลที่ 1</text>
    <text x="510" y="160" font-family="Kanit, Prompt, sans-serif" font-size="96" font-weight="800" fill="#7f1d1d" text-anchor="middle" letter-spacing="8">1 2 3 4 5 6</text>
    <text x="510" y="210" font-family="Prompt, sans-serif" font-size="22" fill="#7f1d1d" text-anchor="middle">6,000,000 บาท</text>
  </g>

  <!-- Footer badge -->
  <g transform="translate(90 570)">
    <text font-family="Prompt, sans-serif" font-size="22" fill="#fff" opacity="0.85">
      ✓ ตรวจหวยงวดล่าสุด  ✓ เลขเด็ดสำนักดัง  ✓ สถิติย้อนหลัง  ✓ ยี่กี 88 รอบ
    </text>
  </g>
</svg>
