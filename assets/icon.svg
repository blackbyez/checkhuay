<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
    <radialGradient id="ballShadow" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Decorative rings -->
  <circle cx="420" cy="90"  r="70" fill="#ffffff" opacity="0.08"/>
  <circle cx="90"  cy="420" r="80" fill="#ffffff" opacity="0.08"/>

  <!-- Center gold lottery ball -->
  <circle cx="256" cy="256" r="150" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="150" fill="url(#ballShadow)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#b8860b" stroke-width="4"/>

  <!-- Big Thai character ห (for หวย) -->
  <text x="256" y="330"
        font-family="'Kanit','Prompt','Noto Sans Thai',sans-serif"
        font-size="200"
        font-weight="800"
        text-anchor="middle"
        fill="#7f1d1d">ห</text>
</svg>
