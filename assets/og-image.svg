<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="90"  r="140" fill="#ffffff" opacity="0.06"/>
  <circle cx="120"  cy="560" r="180" fill="#ffffff" opacity="0.06"/>
  <circle cx="1100" cy="500" r="70"  fill="#f5c542" opacity="0.15"/>

  <!-- Logo circle -->
  <g transform="translate(80 80)">
    <circle cx="60" cy="60" r="60" fill="url(#gold)"/>
    <text x="60" y="90"
          font-family="'Kanit','Prompt','Noto Sans Thai',sans-serif"
          font-size="72" font-weight="800"
          text-anchor="middle" fill="#7f1d1d">ห</text>
  </g>

  <!-- Brand -->
  <text x="220" y="120"
        font-family="'Kanit','Prompt','Noto Sans Thai',sans-serif"
        font-size="66" font-weight="800" fill="#ffffff">เช็คหวย</text>
  <text x="220" y="170"
        font-family="'Prompt','Noto Sans Thai',sans-serif"
        font-size="26" fill="#fde68a">ตรวจหวยรัฐบาล ยี่กี หวยหุ้น เลขเด็ด</text>

  <!-- Ticket card -->
  <g transform="translate(80 240)">
    <rect width="1040" height="280" rx="24" fill="url(#ticket)" stroke="#f5c542" stroke-width="3"/>
    <text x="520" y="70"
          font-family="'Prompt','Noto Sans Thai',sans-serif"
          font-size="24" fill="#7f1d1d" text-anchor="middle" font-weight="600">รางวัลที่ 1 · งวดล่าสุด</text>
    <text x="520" y="180"
          font-family="'Kanit','Prompt',sans-serif"
          font-size="104" font-weight="800" fill="#7f1d1d"
          text-anchor="middle" letter-spacing="12">6 3 9 2 1 4</text>
    <text x="520" y="230"
          font-family="'Prompt','Noto Sans Thai',sans-serif"
          font-size="22" fill="#b91c1c" text-anchor="middle">6,000,000 บาท</text>
  </g>

  <!-- Bottom features -->
  <g transform="translate(80 570)">
    <text font-family="'Prompt','Noto Sans Thai',sans-serif" font-size="20" fill="#ffffff" opacity="0.9">
      ตรวจหวยงวดล่าสุด  ·  เลขเด็ดสำนักดัง  ·  สถิติย้อนหลัง  ·  ยี่กี 88 รอบ  ·  หวยหุ้น 14 ตลาด
    </text>
  </g>
</svg>
